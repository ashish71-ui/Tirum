upstream backend {
    server tirum-backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml;

    # Helper for all proxy blocks
    proxy_set_header Host $http_host; # <--- This is the fix for 400 Bad Request
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://backend;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Referer $http_referer;
    }

    location /user/ {
        proxy_pass http://backend;
    }

    location /health/ {
        proxy_pass http://backend;
    }

    location /static/ {
        alias /app/staticfiles/;
        autoindex off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
        autoindex off;
        expires 1d;
        add_header Cache-Control "public";
    }

    location / {
        return 302 /api/docs/;
    }
}